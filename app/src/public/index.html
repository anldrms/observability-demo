<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Observability Demo</title>
  <style>
    body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    a.button, button { display: inline-block; padding: 0.75rem 1rem; background: #0f62fe; color: white; text-decoration: none; border: 0; border-radius: 6px; cursor: pointer; }
    a.button.secondary { background: #555; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .small { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Observability Demo</h1>
  <p>Use the controls below to generate metrics and logs. Navigate to monitoring UIs via the buttons.</p>
  <div class="grid">
    <div class="card">
      <h3>Generate Traffic</h3>
      <p class="small">Starts N simulated work operations. Some will error intentionally.</p>
      <input id="count" type="number" min="1" max="500" value="100" />
      <button onclick="simulate()">Start Simulation</button>
      <div id="result" class="small"></div>
    </div>
    <div class="card">
      <h3>Endpoints</h3>
      <p><a class="button secondary" href="/metrics" target="_blank">/metrics</a></p>
      <p><a class="button secondary" href="/work" target="_blank">/work</a></p>
      <p><a class="button secondary" href="/health" target="_blank">/health</a></p>
    </div>
    <div class="card">
      <h3>Monitoring UIs</h3>
      <p><a class="button" href="http://localhost:3001" target="_blank">Grafana</a></p>
      <p><a class="button" href="http://localhost:9090" target="_blank">Prometheus</a></p>
      <p><a class="button" href="http://localhost:9000" target="_blank">Graylog</a></p>
    </div>
  </div>
  <script>
    async function simulate() {
      const count = document.getElementById('count').value || 100;
      const res = await fetch('/simulate?count=' + count);
      const data = await res.json();
      document.getElementById('result').innerText = JSON.stringify(data);
    }
  </script>
</body>
</html>
